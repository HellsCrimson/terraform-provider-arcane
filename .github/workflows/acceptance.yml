name: Acceptance Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unit:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: make test

  acceptance:
    name: Acceptance tests
    needs: build-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run acceptance tests
        run: make test-acc

      - name: Tear down test stack
        if: always()
        run: make test-clean
