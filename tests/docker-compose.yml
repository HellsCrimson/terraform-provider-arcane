services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:v1.19.4
    container_name: arcane
    restart: unless-stopped
    ports:
      - 3552:3552
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      - APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY=e26a3bcf2dac7404c6d84909856b7236f21cef4aff82d7ed32c0cc5149405f8a
      - JWT_SECRET=18470dbe4923d2373ca5cbc7e500ddb674d125ef93016d940d48546accf2cec8
      - LOG_LEVEL=info
      - LOG_JSON=true
      - OIDC_ENABLED=false
      - DATABASE_URL=file:data/arcane.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(2500)&_txlock=immediate
      - ADMIN_STATIC_API_KEY=arc_a54fe1040057252a19b34d72008395141a04de7731a28d6f7359baa4923b2f6a

volumes:
  arcane-data:
    driver: local