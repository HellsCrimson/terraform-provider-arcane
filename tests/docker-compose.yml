services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v3.0.1
    container_name: arcane
    restart: unless-stopped
    ports:
      - 3552:3552
    # Allows the Arcane container to reach a webhook listener running on the host
    # (used by the arcane_notification acceptance test) regardless of the bridge subnet.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      # Arcane v3 only reads ARCANE_-prefixed variables and refuses to start
      # when the legacy names are set; JWT_SECRET is retired.
      - ARCANE_APP_URL=http://localhost:3552
      - PUID=1000
      - PGID=1000
      - ARCANE_ENCRYPTION_KEY=e26a3bcf2dac7404c6d84909856b7236f21cef4aff82d7ed32c0cc5149405f8a
      - ARCANE_ADMIN_STATIC_API_KEY=arc_a54fe1040057252a19b34d72008395141a04de7731a28d6f7359baa4923b2f6a

volumes:
  arcane-data:
    driver: local