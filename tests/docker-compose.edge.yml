services:
  dind:
    image: docker:dind
    container_name: arcane-test-dind
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=

  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:v2.0.1
    container_name: arcane-test-edge-agent
    restart: unless-stopped
    depends_on:
      - arcane
      - dind
    environment:
      - EDGE_AGENT=true
      - EDGE_TRANSPORT=poll
      - AGENT_TOKEN=arc_a54fe1040057252a19b34d72008395141a04de7731a28d6f7359baa4923b2f6b
      - MANAGER_API_URL=http://arcane:3552
      - DOCKER_HOST=tcp://dind:2375
    volumes:
      - arcane-edge-data:/app/data

volumes:
  arcane-edge-data:
