# Docker daemon used as the backend of the agent environment in
# TestAccArcaneForgetMissingEnvironment (`make test-acc-forget`).
#
# The Arcane agent itself is not declared here: it can only join once the test
# has created its environment and minted the single-use enrollment token, so
# the test starts it with `docker run` on the network below and removes it
# afterwards.
services:
  dind:
    image: docker:dind
    container_name: arcane-test-dind
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=

networks:
  default:
    # Fixed name so the test can attach the agent container to it.
    name: arcane-test
